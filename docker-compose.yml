services:
  db:
    image: postgres:16-alpine
    container_name: airsense_postgres
    restart: always
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-airsense_user}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-airsense_password}
      POSTGRES_DB: ${POSTGRES_DB:-airsense_db}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-airsense_user} -d ${POSTGRES_DB:-airsense_db}"]
      interval: 5s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: airsense_backend
    restart: always
    depends_on:
      db:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-airsense_user}:${POSTGRES_PASSWORD:-airsense_password}@db:5432/${POSTGRES_DB:-airsense_db}
      CPCB_API_KEY: ${CPCB_API_KEY:-}
      OPENAQ_API_KEY: ${OPENAQ_API_KEY:-}
      ADMIN_SECRET_KEY: ${ADMIN_SECRET_KEY:-mumbai-airsense-dev-secret-key-2026}
    ports:
      - "8000:8000"
    volumes:
      - ./datasets:/app/datasets
      - ./models:/app/models
    command: >
      sh -c "alembic upgrade head &&
             python -c 'from app.db.session import SessionLocal; from app.services.data_ingestion import seed_monitoring_stations, seed_demo_user; db = SessionLocal(); seed_monitoring_stations(db); seed_demo_user(db); db.close()' &&
             uvicorn app.main:app --host 0.0.0.0 --port 8000"

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: airsense_frontend
    restart: always
    depends_on:
      - backend
    environment:
      INTERNAL_API_URL: http://backend:8000/api/v1
      NEXT_PUBLIC_API_BACKEND_URL: http://localhost:8000
    ports:
      - "3000:3000"

volumes:
  postgres_data:
